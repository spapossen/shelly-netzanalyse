[shelly]
# IP oder Hostname des Shelly Pro 3EM (feste IP bzw. DHCP-Reservierung verwenden)
host = 192.168.1.50
# Nur wenn im Shelly ein Passwort gesetzt ist (Benutzer ist immer "admin")
passwort =

[erfassung]
# Abfrageraster der Momentanwerte in Sekunden (mindestens 1)
intervall = 1
# Wie oft die Minutenhistorie aus dem Shelly-Speicher nachgeladen wird
abgleich_minuten = 15
# Sekundenwerte älter als das werden gelöscht (0 = nie). Etwa 11–15 MB je Tag.
# Die Minutenwerte des Shelly bleiben unbegrenzt erhalten.
aufbewahrung_sekundenwerte_tage = 180

[speicher]
datenbank = /var/lib/shelly-monitor/daten.db

[web]
adresse = 0.0.0.0
port = 8080
# Optionaler Zugangsschutz (HTTP Basic Auth). Leer = ohne Anmeldung.
benutzer = admin
passwort =

[anlage]
name = Hausanschluss
# Beschreibung des Messpunkts für den Fachbericht, z. B.
# messpunkt = UV Indoorhalle, versorgt über ca. 250 m Zuleitung aus UV Nord; Wandlermessung am Hausanschluss
messpunkt =
# Netzform (TN-C, TN-S, TN-C-S, TT) für den Fachbericht
netzform =
# Nennstrom der Vorsicherung des Messpunkts je Phase in A (Hausanschluss oder Abgang zur Unterverteilung)
sicherung = 63
nennspannung = 230
# Mindest-Stromsprung in A, der für die Schätzung der Netzimpedanz zählt
min_laststufe_a = 8
zeitzone = Europe/Berlin

[zuleitung]
# Leitungsabschnitte vom Messpunkt bis zur Einspeisung. Damit vergleicht der Bericht die gemessenen Impedanzen
# mit den erwarteten Leitungswiderständen (DIN EN 60228). Je Abschnitt:
#   abschnittN = Länge in m, Querschnitt Außenleiter in mm², cu|al[, Querschnitt N/PEN in mm²][, Bezeichnung]
# Beispiel:
#   abschnitt1 = 150, 35, al, UV Nord → UV Halle (NAYY 4x35)
#   abschnitt2 = 100, 70, al, HV → UV Nord (NAYY 4x70)
abschnitt1 =

[alarm]
# Netzüberwachung: prüft jeden Sekundenwert und meldet Grenzverletzungen aufs Handy (ntfy) und/oder per E-Mail.
# Aktive Alarme stehen als Banner im Bericht, alle Alarme unter /alarme. Test: shelly_monitor.py --alarm-test
aktiv = ja
# ntfy: App „ntfy“ installieren, ein schwer zu erratendes Thema abonnieren und hier eintragen, z. B.
# ntfy_url = https://ntfy.sh/netz-possen-7f3k9q
ntfy_url =
# Nur für geschützte Themen bzw. einen eigenen ntfy-Server
ntfy_token =
# E-Mail (STARTTLS auf Port 587, bei Port 25 unverschlüsselt). Mehrere Empfänger mit Komma trennen.
smtp_host =
smtp_port = 587
smtp_benutzer =
smtp_passwort =
mail_von =
mail_an =
# Spannung L–N in V: Warnung außerhalb u_min–u_max, kritisch außerhalb u_krit_min–u_krit_max,
# Ausfall der Phase unter u_ausfall
u_min = 207
u_max = 253
u_krit_min = 195
u_krit_max = 265
u_ausfall = 100
# Sternpunktverschiebung in V (Hinweis auf unterbrochenen oder hochohmigen Neutralleiter)
sternpunkt_v = 30
sternpunkt_krit_v = 50
# Strom je Phase in A (0 = 90 % der Sicherung)
strom_a = 0
# So viele Sekunden muss eine Grenze verletzt sein, bevor gemeldet wird (Warnung / kritisch)
dauer_s = 5
dauer_krit_s = 1
# Kritischer Alarm, wenn der Shelly so viele Sekunden keine Werte liefert (Spannungsausfall am Messpunkt?)
keine_daten_s = 30
# Entwarnung nach so vielen Sekunden ohne Verletzung; Erinnerung an weiter aktive kritische Alarme
entwarnung_s = 120
wiederholung_min = 30
# Optional: wird jede Minute aufgerufen, solange frische Messwerte kommen (z. B. https://hc-ping.com/<uuid>).
# Der Dienst dort meldet, wenn der Aufruf ausbleibt – also auch, wenn der Server selbst ausfällt.
heartbeat_url =
